shell /opt/homebrew/bin/fish -i -l

# window
remember_window_size no
initial_window_width 120c
initial_window_height 30c
placement_strategy center
window_padding_width 1
resize_in_steps yes
scrollback_lines 100000

allow_remote_control socket-only

# macOS
macos_titlebar_color dark
macos_option_as_alt both
macos_colorspace displayp3

# typography
font_size 14.0
font_family family='JetBrainsMono Nerd Font Mono'
symbol_map U+E000-U+F8FF,U+F0000-U+FFFFF,U+100000-U+10ffff JetBrainsMonoNL Nerd Font
modify_font cell_height 114%
modify_font cell_width 94%
modify_font baseline 95%
text_composition_strategy 1.7 0

# BEGIN_KITTY_THEME
# Gruvbox Dark
include kitty-theme.conf
# END_KITTY_THEME

active_border_color #3c3836
inactive_border_color #3c3836
bell_border_color #3c3836
inactive_text_alpha -0.5

tab_bar_style separator
tab_bar_edge bottom
tab_bar_min_tabs 1
tab_bar_align right
tab_bar_margin_width 8.0
tab_separator ""
tab_title_template " {index} "
tab_title_max_length 32
tab_bar_background #1d2021
tab_bar_margin_color #1d2021
active_tab_foreground #ebdbb2
active_tab_background #282828
active_tab_font_style normal
inactive_tab_foreground #928374
inactive_tab_background #1d2021
inactive_tab_font_style normal

# shortcuts
clear_all_shortcuts yes

map cmd+c copy_to_clipboard
map cmd+v paste_from_clipboard

map cmd+n new_os_window
map cmd+q quit

map cmd+, edit_config_file
map cmd+shift+, load_config_file

map cmd+t new_tab
map cmd+shift+[ previous_tab
map cmd+shift+] next_tab
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9
map cmd+0 goto_tab 10

map cmd+d combine : goto_layout splits : launch --location=vsplit --cwd=current
map cmd+shift+d combine : goto_layout splits : launch --location=hsplit --cwd=current
map cmd+[ previous_window
map cmd+] next_window

map ctrl+h neighboring_window left
map ctrl+j neighboring_window down
map ctrl+k neighboring_window up
map ctrl+l neighboring_window right
map --when-focus-on var:IS_NVIM ctrl+h
map --when-focus-on var:IS_NVIM ctrl+j
map --when-focus-on var:IS_NVIM ctrl+k
map --when-focus-on var:IS_NVIM ctrl+l

map alt+h kitten relative_resize.py left 3 alt+h
map alt+j kitten relative_resize.py down 3 alt+j
map alt+k kitten relative_resize.py up 3 alt+k
map alt+l kitten relative_resize.py right 3 alt+l
map --when-focus-on var:IS_NVIM alt+h
map --when-focus-on var:IS_NVIM alt+j
map --when-focus-on var:IS_NVIM alt+k
map --when-focus-on var:IS_NVIM alt+l

# =============================================================================
# Prefix and command key
# =============================================================================

unbind C-b
set -g prefix C-q
bind-key C-q send-prefix

# =============================================================================
# Terminal integration
# =============================================================================

# Inside tmux, expose tmux's own terminfo entry.
set -g default-terminal "tmux-256color"

# Explicitly enable kitty terminal features tmux can use.
set -as terminal-features ',xterm-kitty:hyperlinks:RGB:sync:usstyle:strikethrough:extkeys'

# Use OSC 52 clipboard integration when possible.
set -s set-clipboard external

# Allow passthrough escape sequences for visible panes.
set -g allow-passthrough all

# Propagate active pane's process/title to the outer terminal (kitty).
# If a process inside the pane sets an OSC 2 title, use it; otherwise fall
# back to the foreground process name.
set -g set-titles on
set -g set-titles-string "#{?#{==:#{pane_title},#h},#{pane_current_command},#{pane_title}}"

# =============================================================================
# General behavior
# =============================================================================

set -g history-limit 9999999
set -g mouse on
set -g focus-events on
set -sg escape-time 0
set -g extended-keys always
set -g extended-keys-format csi-u

# =============================================================================
# Session, window, and pane defaults
# =============================================================================

set -g default-shell "/opt/homebrew/bin/fish"
set -g base-index 1
setw -g pane-base-index 0
set -g renumber-windows on
set -g mode-keys vi

# =============================================================================
# Pane appearance
# =============================================================================

setw -g pane-border-style fg="#504945"
setw -g pane-active-border-style fg="#504945"

# =============================================================================
# Status line
# =============================================================================

set -g status on
set -g status-position bottom
set -g status-justify right
set -g status-style bg="#1d2021",fg="#e2cca9"
set -g status-left "#[fg=yellow]#{?client_prefix,#[fg=#80aa9e],} 󱂬 #S  #[fg=green]󰘴 #W"
set -g status-left-length 50
set -g status-right ' '
set -g status-right-length 50

# =============================================================================
# Window list
# =============================================================================

setw -g window-status-format ' #I '
setw -g window-status-current-format ' #I '
setw -g window-status-separator ''
setw -g window-status-style bg="#1d2021",fg="#7c6f64"
setw -g window-status-current-style bg="#282828",fg="#e2cca9"

# =============================================================================
# Convenience bindings
# =============================================================================

# 새 pane/window를 현재 active pane의 cwd에서 시작합니다.
bind-key '"' split-window -v -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"
bind-key c new-window -c "#{pane_current_path}"

bind-key x kill-pane
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"
bind-key P if-shell -F '#{window_start_flag}' '' 'swap-window -t -1; select-window -t -1'
bind-key N if-shell -F '#{window_end_flag}' '' 'swap-window -t +1; select-window -t +1'

# =============================================================================
# Neovim-aware pane navigation and resizing
# =============================================================================

is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

# Ctrl+h/j/k/l: switch panes, or pass through to Vim/Neovim when active.
bind-key -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# copy-mode-vi has its own key table; override its defaults so pane navigation
# keeps working while browsing scrollback.
bind-key -T copy-mode-vi C-h select-pane -L
bind-key -T copy-mode-vi C-j select-pane -D
bind-key -T copy-mode-vi C-k select-pane -U
bind-key -T copy-mode-vi C-l select-pane -R

# Alt+h/j/k/l: resize panes, or pass through to Vim/Neovim when active.
bind-key -n M-h if-shell "$is_vim" 'send-keys M-h' 'resize-pane -L 3'
bind-key -n M-j if-shell "$is_vim" 'send-keys M-j' 'resize-pane -D 3'
bind-key -n M-k if-shell "$is_vim" 'send-keys M-k' 'resize-pane -U 3'
bind-key -n M-l if-shell "$is_vim" 'send-keys M-l' 'resize-pane -R 3'
